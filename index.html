<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f1e8" />
  <meta name="description" content="Canvas mind map workspace" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Mindfold | 思维工作台</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">M</span><span>Mindfold</span></div>
    <div class="doc-title"><input id="map-title" value="我的第一个想法" aria-label="思维导图标题" /><span id="save-state">已保存</span></div>
    <div class="top-actions"><button class="icon-button" id="theme-toggle" title="切换主题" aria-label="切换主题">◐</button><button class="outline-button" id="export-button">导出 PNG</button><button class="primary-button" id="share-button">分享</button></div>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <div class="sidebar-heading"><span>我的画布</span><button class="new-map" id="new-map" title="新建画布">+</button></div>
      <nav class="map-list" id="map-list"></nav>
      <div class="sidebar-foot"><div class="tip"><span class="tip-icon">✦</span><div><strong>把想法摊开</strong><p>按空格添加子节点<br />拖拽画布自由探索</p></div></div></div>
    </aside>
    <section class="board-shell">
      <div class="board-toolbar">
        <div class="tool-group"><button class="tool active" data-tool="select" title="选择 (V)">↖</button><span class="divider"></span><button class="tool" id="add-child" title="添加子节点 (Tab)">⊕</button><button class="tool" id="add-sibling" title="添加同级节点 (Enter)">⊞</button><button class="tool" id="delete-node" title="删除节点 (Backspace)">⌫</button><button class="tool" id="center-root" title="中心节点回到画布中心">⌾</button></div>
        <div class="zoom-group"><button class="zoom-button" id="zoom-out">−</button><span id="zoom-label">100%</span><button class="zoom-button" id="zoom-in">+</button><button class="zoom-button" id="zoom-fit" title="适应画布">⌗</button></div>
      </div>
      <div id="canvas" class="canvas" tabindex="0"><svg id="connections" class="connections"></svg><div id="nodes-layer" class="nodes-layer"></div><div class="canvas-hint">双击空白处创建中心节点</div></div>
      <div class="statusbar"><span><span class="status-dot"></span> 离线可用</span><span id="node-count">5 个节点</span><span class="keyboard-hint"><kbd>Tab</kbd> 子节点 <kbd>Enter</kbd> 同级 <kbd>Space</kbd> 聚焦</span></div>
    </section>
    <aside class="inspector" id="inspector"><div class="inspector-heading"><span>节点样式</span><button class="close-inspector" id="close-inspector">×</button></div><div class="inspector-content"><label>节点文本</label><textarea id="node-text" rows="3" placeholder="写下你的想法..."></textarea><label>颜色</label><div class="swatches" id="swatches"><button data-color="coral" class="swatch coral"></button><button data-color="blue" class="swatch blue"></button><button data-color="mint" class="swatch mint"></button><button data-color="yellow" class="swatch yellow"></button><button data-color="ink" class="swatch ink"></button><button data-color="lavender" class="swatch lavender"></button><button data-color="peach" class="swatch peach"></button><button data-color="teal" class="swatch teal"></button><button data-color="rose" class="swatch rose"></button><button data-color="lilac" class="swatch lilac"></button><button data-color="lime" class="swatch lime"></button><button data-color="slate" class="swatch slate"></button></div><label>连接方向</label><div class="segmented"><button class="active" data-direction="right">向右</button><button data-direction="left">向左</button><button data-direction="both">双向</button></div><div class="inspector-note">选中节点后，使用快捷键快速组织你的思路。</div></div></aside>
  </main>
  <div id="toast" class="toast"></div>
  <style>.swatch.lavender{background:#b7a6d8}.swatch.peach{background:#efaa86}.swatch.teal{background:#64aaa4}.swatch.rose{background:#d78eae}.swatch.lilac{background:#c6b4df}.swatch.lime{background:#b5c96f}.swatch.slate{background:#71828d}.node[data-color=lavender]{background:#d4c9e8}.node[data-color=peach]{background:#f4c0a6}.node[data-color=teal]{background:#99cbc4}.node[data-color=rose]{background:#e7b4c9}.node[data-color=lilac]{background:#ddd0ed}.node[data-color=lime]{background:#d5e19d}.node[data-color=slate]{background:#a8b8c0}.map-row{display:flex;align-items:center;gap:2px}.map-row .map-item{flex:1}.map-delete{width:26px;height:28px;color:var(--muted);font:16px ui-sans-serif,system-ui,sans-serif;border-radius:5px}.map-delete:hover{background:var(--paper-deep);color:var(--coral)}</style>
    <script src="app.js?v=5"></script>
</body>
</html>
